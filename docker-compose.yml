services:
  # ==========================================================
  # 🐘 BANCO DE DADOS — PostgreSQL 17 (substitui o Supabase)
  # ==========================================================
  db:
    image: postgres:17-alpine
    container_name: studfy-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-studfy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studfy}
      POSTGRES_DB: ${POSTGRES_DB:-studfy}
    ports:
      # Expõe o banco no host (ex.: para inspecionar com DBeaver/psql).
      # Remova esta linha se não quiser o banco acessível de fora.
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-studfy} -d ${POSTGRES_DB:-studfy}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ==========================================================
  # 🔑 KEYCLOAK — Servidor de identidade (login/tokens)
  # A API baixa as chaves públicas (JWKS) daqui para validar os tokens.
  # Sem este serviço a API dava log.Fatal no boot.
  # ==========================================================
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: studfy-keycloak
    restart: unless-stopped
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /realms/master HTTP/1.0\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ==========================================================
  # ⚙️  API — Backend Go/Gin (StudFy)
  # ==========================================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: studfy-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      # Conexão com o Postgres do container (nome do serviço "db" vira o host)
      DATABASE_URL: "postgres://${POSTGRES_USER:-studfy}:${POSTGRES_PASSWORD:-studfy}@db:5432/${POSTGRES_DB:-studfy}?sslmode=disable"
      # Cria/atualiza as tabelas no primeiro boot (banco novo começa vazio)
      AUTO_MIGRATE: ${AUTO_MIGRATE:-true}
      GIN_MODE: ${GIN_MODE:-release}
      PORT: "8080"
      JWT_SECRET: ${JWT_SECRET}
      # 🔑 Keycloak — de onde a API baixa as chaves públicas (JWKS).
      # É o nome do container na rede do Docker, NÃO "localhost": dentro do
      # container, localhost é o próprio container da API.
      KEYCLOAK_URL: ${KEYCLOAK_URL:-http://keycloak:8080/realms/studfy}
      # O `iss` que vem escrito dentro do token, do ponto de vista de quem
      # pediu o token (o navegador/Bruno, no host). Por isso é "localhost".
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://localhost:8080/realms/studfy}
      # A identidade sai inteira do token: nada é lido nem criado em `users`.
      KEYCLOAK_ONLY: ${KEYCLOAK_ONLY:-true}
      FRONTEND_URL: ${FRONTEND_URL}
      BREVO_API_KEY: ${BREVO_API_KEY}
      SENDER_EMAIL: ${SENDER_EMAIL}
    ports:
      - "${API_PORT:-8080}:8080"

volumes:
  pgdata:
